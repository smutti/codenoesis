name: Delivery task
description: Define one testable CodeNoesis outcome.
title: ""
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Keep the task concise. An issue is useful for coordination but is not required before implementation.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Describe the user-visible or executable outcome and its non-goals.
      placeholder: |
        Outcome:
        Non-goals:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State the observable success and important failure or boundary cases.
      placeholder: |
        - Given ..., when ..., then ...
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: List the focused tests or checks that will prove the outcome.
    validations:
      required: true

  - type: textarea
    id: benchmark
    attributes:
      label: Benchmark
      description: Describe the benchmark or write "not applicable".
      value: "not applicable"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Compatibility and operational notes
      description: Record relevant migration, security, dependency, or rollout constraints.
    validations:
      required: false

  - type: checkboxes
    id: readiness
    attributes:
      label: Ready
      options:
        - label: The objective and acceptance criteria are testable.
          required: true
        - label: No secret, credential, or private source corpus is included.
          required: true
