name: Codex - propose patch from issue

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number containing the objective and acceptance criteria
        required: true
        type: number

permissions: {}

concurrency:
  group: codex-proposal-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  generate-proposal:
    name: Generate patch artifact without write credentials
    if: vars.CODEX_AUTOMATION_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: codex-model
    permissions:
      contents: read
      issues: read
    outputs:
      has_patch: ${{ steps.patch.outputs.has_patch }}
      base_sha: ${{ steps.base.outputs.base_sha }}
      base_branch: ${{ steps.base.outputs.base_branch }}
      allowed_paths_json: ${{ steps.issue.outputs.allowed_paths_json }}
      protected_paths_json: ${{ steps.issue.outputs.protected_paths_json }}
      requirement_ids: ${{ steps.issue.outputs.requirement_ids }}
      requirement_ids_json: ${{ steps.issue.outputs.requirement_ids_json }}
      delivery_slice: ${{ steps.issue.outputs.delivery_slice }}
      risk: ${{ steps.issue.outputs.risk }}
      issue_updated_at: ${{ steps.issue.outputs.issue_updated_at }}
      issue_body_sha256: ${{ steps.issue.outputs.issue_body_sha256 }}
      policy_sha256: ${{ steps.base.outputs.policy_sha256 }}
    steps:
      - name: Load and validate untrusted issue context
        id: issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const crypto = require("crypto");
            const raw = process.env.ISSUE_NUMBER;
            if (!/^\d+$/.test(raw ?? "")) {
              core.setFailed("A numeric issue number is required.");
              return;
            }

            const number = Number(raw);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });

            if (issue.pull_request) {
              core.setFailed("The selected number belongs to a pull request, not an issue.");
              return;
            }
            if (issue.state !== "open") {
              core.setFailed("Only open issues can start an implementation proposal.");
              return;
            }

            const body = issue.body ?? "";
            const fieldNames = [
              "Requirement IDs",
              "Requirement status",
              "Delivery slice",
              "Demonstrable objective",
              "Acceptance oracle and failure behavior",
              "Red test plan",
              "Risk classification",
              "Risk rationale and threats",
              "Allowed paths",
              "Protected or forbidden paths",
              "Dependencies, decisions, and compatibility",
              "Required evidence pack",
              "Execution budgets",
              "Additional stop conditions",
              "Readiness confirmation",
            ];

            const bodyLines = body.split(/\r?\n/);
            const fieldPositions = new Map();
            for (const name of fieldNames) {
              const marker = `### ${name}`;
              const positions = bodyLines
                .map((line, index) => line.trim() === marker ? index : -1)
                .filter((index) => index >= 0);
              if (positions.length !== 1) {
                core.setFailed(`Issue must contain exactly one '${marker}' heading.`);
                return;
              }
              fieldPositions.set(name, positions[0]);
            }
            const orderedPositions = fieldNames.map((name) => fieldPositions.get(name));
            if (orderedPositions.some((position, index) =>
              index > 0 && position <= orderedPositions[index - 1]
            )) {
              core.setFailed("Agent-ready issue fields are not in the trusted form order.");
              return;
            }

            function extractField(name) {
              const start = fieldPositions.get(name) + 1;
              const nextRelative = bodyLines
                .slice(start)
                .findIndex((line) => line.trim().startsWith("### "));
              const end = nextRelative < 0 ? bodyLines.length : start + nextRelative;
              return bodyLines.slice(start, end).join("\n").trim();
            }

            const fields = Object.fromEntries(
              fieldNames.map((name) => [name, extractField(name)])
            );
            const missing = fieldNames.filter((name) => fields[name] === "");
            if (missing.length > 0) {
              core.setFailed(`Issue is missing agent-ready fields: ${missing.join(", ")}`);
              return;
            }
            if (fields["Requirement status"] !== "Approved") {
              core.setFailed("Autonomous implementation requires an Approved requirement.");
              return;
            }
            const requirementIds = fields["Requirement IDs"]
              .split(",")
              .map((value) => value.trim())
              .filter(Boolean);
            const requirementPattern = /^[A-Z][A-Z0-9]*(?:-[A-Z0-9]+)+-[0-9]{3}$/;
            if (
              requirementIds.length === 0 ||
              requirementIds.some((value) => !requirementPattern.test(value)) ||
              new Set(requirementIds).size !== requirementIds.length
            ) {
              core.setFailed(
                "Requirement IDs must be a unique comma-separated list of stable IDs."
              );
              return;
            }
            const sliceMatch = fields["Delivery slice"].match(/^S(?:[0-9]|1[0-4])\b/);
            if (!sliceMatch) {
              core.setFailed("Delivery slice must be exactly one value from S0 through S14.");
              return;
            }
            const risk = fields["Risk classification"].trim();
            if (!["low", "medium", "high", "critical"].includes(risk)) {
              core.setFailed("Risk classification is invalid.");
              return;
            }
            if (["high", "critical"].includes(risk)) {
              core.setFailed(
                "Initial A1 automation accepts only low- or medium-risk proposals."
              );
              return;
            }

            function pathPatterns(value, fieldName) {
              const patterns = value
                .split(/\r?\n/)
                .map((line) => line.match(/^\s*[-*]\s+(.+?)\s*$/)?.[1] ?? "")
                .map((entry) => entry.replace(/^`|`$/g, "").trim())
                .filter(Boolean)
                .map((entry) => entry.endsWith("/...")
                  ? `${entry.slice(0, -3)}**`
                  : entry.endsWith("/") ? `${entry}**` : entry);

              for (const pattern of patterns) {
                const segments = pattern.split("/");
                if (
                  pattern.startsWith("/") ||
                  pattern.startsWith("!") ||
                  pattern.includes("\\") ||
                  /[\u0000-\u001f\u007f]/.test(pattern) ||
                  segments.includes(".") ||
                  segments.includes("..") ||
                  segments.includes("") ||
                  segments.some((segment) => segment.includes("**") && segment !== "**")
                ) {
                  core.setFailed(`${fieldName} contains an unsafe path pattern: ${pattern}`);
                  return null;
                }
              }
              if (patterns.length === 0) {
                core.setFailed(`${fieldName} must contain at least one bullet path pattern.`);
                return null;
              }
              if (new Set(patterns).size !== patterns.length) {
                core.setFailed(`${fieldName} contains duplicate path patterns.`);
                return null;
              }
              return patterns;
            }

            const allowedPaths = pathPatterns(fields["Allowed paths"], "Allowed paths");
            const protectedPaths = pathPatterns(
              fields["Protected or forbidden paths"],
              "Protected paths"
            );
            if (!allowedPaths || !protectedPaths) return;

            const expectedReadiness = [
              "The requirement status, owner, oracle, dependencies, and blocking decisions have been checked against the SRS.",
              "Allowed paths are minimal and do not hide a required protected-path change.",
              "The task can demonstrate Red before production implementation and retain machine-readable evidence.",
              "No secret, private source corpus, or untrusted instruction has been placed in this issue.",
            ];
            const readinessChecks = fields["Readiness confirmation"]
              .split(/\r?\n/)
              .map((line) => line.match(/^\s*- \[[xX]\] (.+?)\s*$/)?.[1] ?? "")
              .filter(Boolean);
            if (
              readinessChecks.length !== expectedReadiness.length ||
              readinessChecks.some((value, index) => value !== expectedReadiness[index])
            ) {
              core.setFailed("Every readiness confirmation must be checked.");
              return;
            }

            core.setOutput("allowed_paths_json", JSON.stringify(allowedPaths));
            core.setOutput("protected_paths_json", JSON.stringify(protectedPaths));
            core.setOutput("requirement_ids", requirementIds.join(", "));
            core.setOutput("requirement_ids_json", JSON.stringify(requirementIds));
            core.setOutput("delivery_slice", sliceMatch[0]);
            core.setOutput("risk", risk);
            core.setOutput("issue_updated_at", issue.updated_at);
            const bodySha256 = crypto.createHash("sha256").update(body).digest("hex");
            core.setOutput("issue_body_sha256", bodySha256);

            const untrustedContext = {
              number: issue.number,
              title: issue.title,
              body,
              body_sha256: bodySha256,
              updated_at: issue.updated_at,
              parsed_agent_ready_fields: fields,
              labels: issue.labels.map((label) =>
                typeof label === "string" ? label : label.name
              ),
              milestone: issue.milestone?.title ?? null,
              author: issue.user?.login ?? null,
              html_url: issue.html_url,
            };

            const destination = path.join(
              process.env.RUNNER_TEMP,
              "codex-issue-context.json"
            );
            fs.writeFileSync(destination, JSON.stringify(untrustedContext, null, 2), {
              encoding: "utf8",
              mode: 0o600,
            });

      - name: Check out default branch without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture immutable base and trusted automation inputs
        id: base
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          DELIVERY_SLICE: ${{ steps.issue.outputs.delivery_slice }}
          REQUIREMENT_IDS_JSON: ${{ steps.issue.outputs.requirement_ids_json }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "base_branch=$BASE_BRANCH" >> "$GITHUB_OUTPUT"
          policy_sha=$(sha256sum .github/codex/policy.json | cut -d ' ' -f 1)
          echo "policy_sha256=$policy_sha" >> "$GITHUB_OUTPUT"
          install -m 0600 .github/codex/prompts/propose-from-issue.md \
            "$RUNNER_TEMP/codex-proposal-prompt.md"
          install -m 0600 .github/codex/schemas/proposal-output.schema.json \
            "$RUNNER_TEMP/codex-proposal-output.schema.json"

          mapfile -t requirement_ids < <(jq -r '.[]' <<< "$REQUIREMENT_IDS_JSON")
          authorization_args=()
          for requirement_id in "${requirement_ids[@]}"; do
            authorization_args+=(--requirement-id "$requirement_id")
          done
          python3 .github/codex/scripts/codex_policy.py authorize \
            --policy .github/codex/policy.json \
            --slice "$DELIVERY_SLICE" \
            "${authorization_args[@]}" \
            > "$RUNNER_TEMP/codex-requirement-authorization.json"

          current_srs_blob=$(git rev-parse HEAD:docs/software/software-requirements-specification.md)
          while IFS= read -r approval_sha; do
            git cat-file -e "$approval_sha^{commit}"
            git merge-base --is-ancestor "$approval_sha" HEAD
            approved_srs_blob=$(git rev-parse \
              "$approval_sha:docs/software/software-requirements-specification.md")
            test "$approved_srs_blob" = "$current_srs_blob"
          done < <(jq -r '.approval_records[].source_sha' \
            "$RUNNER_TEMP/codex-requirement-authorization.json" | sort -u)

      - name: Run one bounded Codex proposal attempt
        id: codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        env:
          CODEX_ISSUE_CONTEXT_FILE: ${{ runner.temp }}/codex-issue-context.json
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/codex-proposal-prompt.md
          output-schema-file: ${{ runner.temp }}/codex-proposal-output.schema.json
          output-file: ${{ runner.temp }}/codex-proposal.json
          codex-version: "0.144.5"
          model: gpt-5.6
          effort: ultra
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

      - name: Serialize bounded patch and manifest
        id: patch
        env:
          BASE_SHA: ${{ steps.base.outputs.base_sha }}
          BASE_BRANCH: ${{ steps.base.outputs.base_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_BODY_SHA256: ${{ steps.issue.outputs.issue_body_sha256 }}
          ISSUE_UPDATED_AT: ${{ steps.issue.outputs.issue_updated_at }}
          REQUIREMENT_IDS_JSON: ${{ steps.issue.outputs.requirement_ids_json }}
          DELIVERY_SLICE: ${{ steps.issue.outputs.delivery_slice }}
          RISK: ${{ steps.issue.outputs.risk }}
          POLICY_SHA256: ${{ steps.base.outputs.policy_sha256 }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git add -N -- .
          git diff --binary --full-index HEAD -- > "$RUNNER_TEMP/codex.patch"

          patch_size=$(wc -c < "$RUNNER_TEMP/codex.patch")
          if [ "$patch_size" -gt 2097152 ]; then
            echo "Patch exceeds the 2 MiB automation limit." >&2
            exit 1
          fi

          if [ "$patch_size" -gt 0 ]; then
            has_patch=true
            patch_sha=$(sha256sum "$RUNNER_TEMP/codex.patch" | cut -d ' ' -f 1)
          else
            has_patch=false
            patch_sha=""
          fi
          echo "has_patch=$has_patch" >> "$GITHUB_OUTPUT"

          jq -n \
            --arg base_sha "$BASE_SHA" \
            --arg base_branch "$BASE_BRANCH" \
            --arg workflow_sha "$WORKFLOW_SHA" \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg run_id "${{ github.run_id }}" \
            --arg run_attempt "${{ github.run_attempt }}" \
            --arg patch_sha256 "$patch_sha" \
            --argjson patch_size "$patch_size" \
            --arg issue_body_sha256 "$ISSUE_BODY_SHA256" \
            --arg issue_updated_at "$ISSUE_UPDATED_AT" \
            --argjson requirement_ids "$REQUIREMENT_IDS_JSON" \
            --arg delivery_slice "$DELIVERY_SLICE" \
            --arg risk "$RISK" \
            --arg policy_sha256 "$POLICY_SHA256" \
            --arg prompt_sha256 "$(sha256sum "$RUNNER_TEMP/codex-proposal-prompt.md" | cut -d ' ' -f 1)" \
            --arg output_schema_sha256 "$(sha256sum "$RUNNER_TEMP/codex-proposal-output.schema.json" | cut -d ' ' -f 1)" \
            '{
              base_sha: $base_sha,
              base_branch: $base_branch,
              workflow_sha: $workflow_sha,
              issue_number: $issue_number,
              run_id: $run_id,
              run_attempt: $run_attempt,
              patch_sha256: $patch_sha256,
              patch_size: $patch_size,
              issue_body_sha256: $issue_body_sha256,
              issue_updated_at: $issue_updated_at,
              requirement_ids: $requirement_ids,
              delivery_slice: $delivery_slice,
              risk: $risk,
              policy_sha256: $policy_sha256,
              prompt_sha256: $prompt_sha256,
              output_schema_sha256: $output_schema_sha256,
              autonomous_repair_iterations: 0
            }' > "$RUNNER_TEMP/codex-manifest.json"

      - name: Upload proposal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-proposal-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codex.patch
            ${{ runner.temp }}/codex-proposal.json
            ${{ runner.temp }}/codex-manifest.json
            ${{ runner.temp }}/codex-issue-context.json
            ${{ runner.temp }}/codex-requirement-authorization.json
          if-no-files-found: error
          retention-days: 7

  publish-proposal:
    name: Validate patch and open draft PR without model credentials
    needs: generate-proposal
    if: needs.generate-proposal.outputs.has_patch == 'true' && vars.CODEX_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: codex-publisher
    permissions:
      contents: read
      issues: read
    steps:
      - name: Download proposal evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: codex-proposal-${{ inputs.issue_number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-evidence

      - name: Validate artifact identity and integrity
        env:
          EXPECTED_BASE_SHA: ${{ needs.generate-proposal.outputs.base_sha }}
          EXPECTED_BASE_BRANCH: ${{ needs.generate-proposal.outputs.base_branch }}
          EXPECTED_WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_ISSUE: ${{ inputs.issue_number }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_ISSUE_BODY_SHA256: ${{ needs.generate-proposal.outputs.issue_body_sha256 }}
          EXPECTED_ISSUE_UPDATED_AT: ${{ needs.generate-proposal.outputs.issue_updated_at }}
          EXPECTED_REQUIREMENT_IDS_JSON: ${{ needs.generate-proposal.outputs.requirement_ids_json }}
          EXPECTED_DELIVERY_SLICE: ${{ needs.generate-proposal.outputs.delivery_slice }}
          EXPECTED_RISK: ${{ needs.generate-proposal.outputs.risk }}
          EXPECTED_POLICY_SHA256: ${{ needs.generate-proposal.outputs.policy_sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/codex-evidence"
          test "$(wc -c < codex.patch)" -le 2097152
          test "$(wc -c < codex-proposal.json)" -le 524288
          jq -e \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg base_branch "$EXPECTED_BASE_BRANCH" \
            --arg workflow_sha "$EXPECTED_WORKFLOW_SHA" \
            --argjson issue_number "$EXPECTED_ISSUE" \
            --arg run_id "$EXPECTED_RUN_ID" \
            --arg run_attempt "$EXPECTED_RUN_ATTEMPT" \
            --arg issue_body_sha256 "$EXPECTED_ISSUE_BODY_SHA256" \
            --arg issue_updated_at "$EXPECTED_ISSUE_UPDATED_AT" \
            --argjson requirement_ids "$EXPECTED_REQUIREMENT_IDS_JSON" \
            --arg delivery_slice "$EXPECTED_DELIVERY_SLICE" \
            --arg risk "$EXPECTED_RISK" \
            --arg policy_sha256 "$EXPECTED_POLICY_SHA256" \
            '.base_sha == $base_sha
             and .base_branch == $base_branch
             and .workflow_sha == $workflow_sha
             and .base_sha == .workflow_sha
             and .issue_number == $issue_number
             and .run_id == $run_id
             and .run_attempt == $run_attempt
             and .issue_body_sha256 == $issue_body_sha256
             and .issue_updated_at == $issue_updated_at
             and .requirement_ids == $requirement_ids
             and .delivery_slice == $delivery_slice
             and .risk == $risk
             and .policy_sha256 == $policy_sha256
             and .autonomous_repair_iterations == 0
             and .patch_size > 0
             and .patch_size <= 2097152
             and (.patch_sha256 | test("^[0-9a-f]{64}$"))
             and (.prompt_sha256 | test("^[0-9a-f]{64}$"))
             and (.output_schema_sha256 | test("^[0-9a-f]{64}$"))' \
            codex-manifest.json >/dev/null
          jq -e \
            --arg issue_body_sha256 "$EXPECTED_ISSUE_BODY_SHA256" \
            --arg issue_updated_at "$EXPECTED_ISSUE_UPDATED_AT" \
            '.body_sha256 == $issue_body_sha256 and .updated_at == $issue_updated_at' \
            codex-issue-context.json >/dev/null
          expected_sha=$(jq -r '.patch_sha256' codex-manifest.json)
          printf '%s  %s\n' "$expected_sha" codex.patch | sha256sum -c -

      - name: Check out immutable proposal base
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.generate-proposal.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply and validate untrusted patch
        env:
          ALLOWED_PATHS_JSON: ${{ needs.generate-proposal.outputs.allowed_paths_json }}
          PROTECTED_PATHS_JSON: ${{ needs.generate-proposal.outputs.protected_paths_json }}
          BASE_SHA: ${{ needs.generate-proposal.outputs.base_sha }}
          DELIVERY_SLICE: ${{ needs.generate-proposal.outputs.delivery_slice }}
          POLICY_SHA256: ${{ needs.generate-proposal.outputs.policy_sha256 }}
          REQUIREMENT_IDS_JSON: ${{ needs.generate-proposal.outputs.requirement_ids_json }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(sha256sum .github/codex/policy.json | cut -d ' ' -f 1)" = "$POLICY_SHA256"
          test "$(jq -r '.prompt_sha256' "$RUNNER_TEMP/codex-evidence/codex-manifest.json")" = \
            "$(sha256sum .github/codex/prompts/propose-from-issue.md | cut -d ' ' -f 1)"
          test "$(jq -r '.output_schema_sha256' "$RUNNER_TEMP/codex-evidence/codex-manifest.json")" = \
            "$(sha256sum .github/codex/schemas/proposal-output.schema.json | cut -d ' ' -f 1)"

          mapfile -t requirement_ids < <(jq -r '.[]' <<< "$REQUIREMENT_IDS_JSON")
          authorization_args=()
          for requirement_id in "${requirement_ids[@]}"; do
            authorization_args+=(--requirement-id "$requirement_id")
          done
          python3 .github/codex/scripts/codex_policy.py authorize \
            --policy .github/codex/policy.json \
            --slice "$DELIVERY_SLICE" \
            "${authorization_args[@]}" \
            > "$RUNNER_TEMP/codex-current-authorization.json"
          current_srs_blob=$(git rev-parse HEAD:docs/software/software-requirements-specification.md)
          while IFS= read -r approval_sha; do
            git cat-file -e "$approval_sha^{commit}"
            git merge-base --is-ancestor "$approval_sha" HEAD
            approved_srs_blob=$(git rev-parse \
              "$approval_sha:docs/software/software-requirements-specification.md")
            test "$approved_srs_blob" = "$current_srs_blob"
          done < <(jq -r '.approval_records[].source_sha' \
            "$RUNNER_TEMP/codex-current-authorization.json" | sort -u)
          cmp --silent \
            "$RUNNER_TEMP/codex-current-authorization.json" \
            "$RUNNER_TEMP/codex-evidence/codex-requirement-authorization.json"

          git apply --check --whitespace=error-all "$RUNNER_TEMP/codex-evidence/codex.patch"
          git apply --index --whitespace=error-all "$RUNNER_TEMP/codex-evidence/codex.patch"
          git diff --cached --check

          git diff --cached --name-only -z --no-renames \
            > "$RUNNER_TEMP/codex-changed-paths"
          python3 .github/codex/scripts/codex_policy.py validate-paths \
            --policy .github/codex/policy.json \
            --changed-paths-file "$RUNNER_TEMP/codex-changed-paths" \
            --allowed-patterns-json "$ALLOWED_PATHS_JSON" \
            --protected-patterns-json "$PROTECTED_PATHS_JSON" \
            > "$RUNNER_TEMP/codex-path-validation.json"
          python3 .github/codex/scripts/validate_proposal.py \
            "$RUNNER_TEMP/codex-evidence/codex-proposal.json" \
            "$RUNNER_TEMP/codex-changed-paths" \
            > "$RUNNER_TEMP/codex-proposal-validation.json"

          mapfile -d '' changed_paths < "$RUNNER_TEMP/codex-changed-paths"
          for path in "${changed_paths[@]}"; do
            old_mode=$(git ls-tree "$BASE_SHA" -- "$path" | awk 'NR == 1 { print $1 }')
            new_mode=$(git ls-files -s -- "$path" | awk 'NR == 1 { print $1 }')
            if [ "$old_mode" = "120000" ] || [ "$old_mode" = "160000" ] || \
               [ "$new_mode" = "120000" ] || [ "$new_mode" = "160000" ]; then
              echo "Patch changes a symlink or submodule at: $path" >&2
              exit 1
            fi
          done

          python3 - <<'PY' > "$RUNNER_TEMP/codex-changed-paths.md"
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, ".github/codex/scripts")
          from render_review import inert_html

          raw = Path(os.environ["RUNNER_TEMP"], "codex-changed-paths").read_bytes()
          for item in (part.decode("utf-8") for part in raw.split(b"\0") if part):
              print(f"- <code>{inert_html(item)}</code>")
          PY

      - name: Revalidate unchanged issue immediately before publication
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_BODY_SHA256: ${{ needs.generate-proposal.outputs.issue_body_sha256 }}
          EXPECTED_UPDATED_AT: ${{ needs.generate-proposal.outputs.issue_updated_at }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          script: |
            const crypto = require("crypto");
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
            });
            const bodySha256 = crypto
              .createHash("sha256")
              .update(issue.body ?? "")
              .digest("hex");
            if (
              issue.pull_request ||
              issue.state !== "open" ||
              issue.updated_at !== process.env.EXPECTED_UPDATED_AT ||
              bodySha256 !== process.env.EXPECTED_BODY_SHA256
            ) {
              core.setFailed(
                "The issue changed after proposal generation; discard this artifact and start a new run."
              );
            }

      - name: Create least-privilege publisher App token
        id: publisher-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.CODEX_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.CODEX_PUBLISHER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve publisher App commit identity
        id: publisher-identity
        env:
          APP_SLUG: ${{ steps.publisher-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          set -euo pipefail
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Commit proposal branch
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PUBLISHER_NAME: ${{ steps.publisher-identity.outputs.name }}
          PUBLISHER_EMAIL: ${{ steps.publisher-identity.outputs.email }}
          PUBLISHER_TOKEN: ${{ steps.publisher-token.outputs.token }}
        run: |
          set -euo pipefail
          branch="codex/issue-${ISSUE_NUMBER}-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "$PUBLISHER_NAME"
          git config user.email "$PUBLISHER_EMAIL"
          git switch -c "$branch"
          git -c core.hooksPath=/dev/null commit --no-gpg-sign \
            -m "Propose issue #${ISSUE_NUMBER} via Codex"
          git remote set-url origin \
            "https://x-access-token:${PUBLISHER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_ENV"

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ steps.publisher-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BASE_BRANCH: ${{ needs.generate-proposal.outputs.base_branch }}
          BASE_SHA: ${{ needs.generate-proposal.outputs.base_sha }}
          REQUIREMENT_IDS: ${{ needs.generate-proposal.outputs.requirement_ids }}
          DELIVERY_SLICE: ${{ needs.generate-proposal.outputs.delivery_slice }}
          RISK: ${{ needs.generate-proposal.outputs.risk }}
        run: |
          set -euo pipefail
          patch_sha=$(jq -r '.patch_sha256' "$RUNNER_TEMP/codex-evidence/codex-manifest.json")
          {
            echo "## Outcome"
            echo
            echo "Codex generated a bounded **proposal-only** patch for issue #${ISSUE_NUMBER}."
            echo "It remains draft and must not be treated as independently verified TDD evidence."
            echo
            echo "Refs #${ISSUE_NUMBER}"
            echo
            echo "## Traceability"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Requirement IDs | ${REQUIREMENT_IDS} |"
            echo "| Requirement status | Approved in trusted registry |"
            echo "| Slice | \`${DELIVERY_SLICE}\` |"
            echo "| Risk | \`${RISK}\` |"
            echo "| Base SHA | \`${BASE_SHA}\` |"
            echo "| Patch SHA-256 | \`${patch_sha}\` |"
            echo
            echo "## Scope — actual changed paths"
            echo
            cat "$RUNNER_TEMP/codex-changed-paths.md"
            echo
            echo "## TDD and verification status"
            echo
            echo "- Structured Red/Green claims and the immutable patch are retained in the workflow artifact."
            echo "- Autonomous repair iterations: **0**."
            echo "- Auto-merge: **disabled**."
            echo "- Required deterministic checks: \`CI policy gate\` and \`Benchmark policy gate\`."
            echo "- A maintainer must inspect the commands, expected Red reason, logs, diff, and benchmark evidence before marking this PR ready."
            echo
            echo "## Autonomous run record"
            echo
            echo "- Model: \`gpt-5.6\`, reasoning effort \`ultra\`."
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Evidence retention: 7 days."
            echo
            echo "## Human decisions still required"
            echo
            echo "- [ ] Confirm the issue, registry approval, oracle, scope, and risk classification."
            echo "- [ ] Reproduce and retain Red evidence from the pre-implementation state."
            echo "- [ ] Verify Green/regression results and complete the repository PR template evidence."
            echo "- [ ] Request independent owner review before changing draft state."
          } > pr-body.md

          gh pr create \
            --draft \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "Codex proposal for issue #${ISSUE_NUMBER}" \
            --body-file pr-body.md
