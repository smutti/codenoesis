name: Local release candidate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main commit to build
        required: true
        type: string

permissions: {}

concurrency:
  group: local-release-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-guard:
    name: Validate protected source identity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require exact protected main revision
        env:
          ACTUAL_REF: ${{ github.ref }}
          ACTUAL_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REF" = "refs/heads/main"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'

  supply-chain:
    name: Generate exact target supply evidence
    needs: source-guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Install exact advisory scanner
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Generate three target evidence sets
        run: |
          set -euo pipefail
          test "$(cargo-audit --version)" = "cargo-audit 0.22.2"
          cargo audit --json > "$RUNNER_TEMP/audit.json"
          mkdir "$RUNNER_TEMP/supply"
          for target in \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-unknown-linux-gnu
          do
            cargo fetch --locked --target "$target"
            cargo metadata --locked --filter-platform "$target" \
              --format-version 1 > "$RUNNER_TEMP/metadata-$target.json"
            mkdir "$RUNNER_TEMP/supply/$target"
            python3 scripts/generate_local_supply_chain_evidence.py \
              --metadata "$RUNNER_TEMP/metadata-$target.json" \
              --cargo-lock Cargo.lock \
              --audit "$RUNNER_TEMP/audit.json" \
              --audit-version 0.22.2 \
              --policy supply-chain/local-release-policy-v1.json \
              --target "$target" \
              --output "$RUNNER_TEMP/supply/$target"
          done

      - name: Upload immutable supply evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-release-supply-${{ github.sha }}
          path: ${{ runner.temp }}/supply
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux candidate
    needs: [source-guard, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Download exact supply evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: local-release-supply-${{ github.sha }}
          path: ${{ runner.temp }}/supply
      - name: Build package verify and smoke Linux
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          set -euo pipefail
          cargo build --release --locked -p noesis
          mkdir "$RUNNER_TEMP/g1" "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/smoke"
          cargo run --locked -p xtask -- package-local-cli \
            --binary target/release/noesis --output "$RUNNER_TEMP/g1"
          bundle="$(find "$RUNNER_TEMP/g1" -mindepth 1 -maxdepth 1 -type d)"
          cargo run --locked -p xtask -- package-local-release-candidate \
            --bundle "$bundle" --source-commit "$GITHUB_SHA" \
            --supply-chain "$RUNNER_TEMP/supply/$TARGET" \
            --output "$RUNNER_TEMP/candidate"
          candidate="$(find "$RUNNER_TEMP/candidate" -mindepth 1 -maxdepth 1 -type d)"
          cargo run --locked -p xtask -- verify-local-release-candidate \
            --candidate "$candidate"
          archive="$(find "$candidate" -maxdepth 1 -type f -name '*.zip')"
          python3 -c 'import pathlib,sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$archive" "$RUNNER_TEMP/smoke"
          extracted="$(find "$RUNNER_TEMP/smoke" -mindepth 1 -maxdepth 1 -type d)"
          chmod 755 "$extracted/bin/noesis"
          "$extracted/bin/noesis" --config "$extracted/etc/codenoesis/config.json" \
            config validate --format json
          "$extracted/bin/noesis" --config "$extracted/etc/codenoesis/config.json" \
            profile --id local-experimental-r17 --format json
      - name: Upload Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-linux-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS candidate
    needs: [source-guard, supply-chain]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Download exact supply evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: local-release-supply-${{ github.sha }}
          path: ${{ runner.temp }}/supply
      - name: Build package verify and smoke macOS
        env:
          TARGET: aarch64-apple-darwin
        run: |
          set -euo pipefail
          cargo build --release --locked -p noesis
          mkdir "$RUNNER_TEMP/g1" "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/smoke"
          cargo run --locked -p xtask -- package-local-cli \
            --binary target/release/noesis --output "$RUNNER_TEMP/g1"
          bundle="$(find "$RUNNER_TEMP/g1" -mindepth 1 -maxdepth 1 -type d)"
          cargo run --locked -p xtask -- package-local-release-candidate \
            --bundle "$bundle" --source-commit "$GITHUB_SHA" \
            --supply-chain "$RUNNER_TEMP/supply/$TARGET" \
            --output "$RUNNER_TEMP/candidate"
          candidate="$(find "$RUNNER_TEMP/candidate" -mindepth 1 -maxdepth 1 -type d)"
          cargo run --locked -p xtask -- verify-local-release-candidate \
            --candidate "$candidate"
          archive="$(find "$candidate" -maxdepth 1 -type f -name '*.zip')"
          python3 -c 'import pathlib,sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' \
            "$archive" "$RUNNER_TEMP/smoke"
          extracted="$(find "$RUNNER_TEMP/smoke" -mindepth 1 -maxdepth 1 -type d)"
          chmod 755 "$extracted/bin/noesis"
          "$extracted/bin/noesis" --config "$extracted/etc/codenoesis/config.json" \
            config validate --format json
          "$extracted/bin/noesis" --config "$extracted/etc/codenoesis/config.json" \
            profile --id local-experimental-r17 --format json
      - name: Upload macOS candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-macos-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows candidate
    needs: [source-guard, supply-chain]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - name: Download exact supply evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: local-release-supply-${{ github.sha }}
          path: ${{ runner.temp }}/supply
      - name: Build package verify and smoke Windows
        shell: pwsh
        env:
          TARGET: x86_64-pc-windows-msvc
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked -p noesis
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/g1" | Out-Null
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/candidate" | Out-Null
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/smoke" | Out-Null
          cargo run --locked -p xtask -- package-local-cli `
            --binary target/release/noesis.exe --output "$env:RUNNER_TEMP/g1"
          $bundle = (Get-ChildItem "$env:RUNNER_TEMP/g1" -Directory).FullName
          cargo run --locked -p xtask -- package-local-release-candidate `
            --bundle $bundle --source-commit $env:GITHUB_SHA `
            --supply-chain "$env:RUNNER_TEMP/supply/$env:TARGET" `
            --output "$env:RUNNER_TEMP/candidate"
          $candidate = (Get-ChildItem "$env:RUNNER_TEMP/candidate" -Directory).FullName
          cargo run --locked -p xtask -- verify-local-release-candidate `
            --candidate $candidate
          $archive = (Get-ChildItem $candidate -File -Filter *.zip).FullName
          python -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" `
            $archive "$env:RUNNER_TEMP/smoke"
          $extracted = (Get-ChildItem "$env:RUNNER_TEMP/smoke" -Directory).FullName
          & "$extracted/bin/noesis.exe" --config "$extracted/etc/codenoesis/config.json" `
            config validate --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$extracted/bin/noesis.exe" --config "$extracted/etc/codenoesis/config.json" `
            profile --id local-experimental-r17 --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-windows-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest immutable candidate subjects
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download immutable candidate subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*-${{ github.sha }}
          path: intermediate
          merge-multiple: true
      - name: Verify fixed subject checksums
        run: |
          set -euo pipefail
          test "$(find intermediate -type f | wc -l)" -eq 24
          while IFS= read -r checksums
          do
            (cd "$(dirname "$checksums")" && sha256sum -c checksums.sha256)
          done < <(find intermediate -type f -name checksums.sha256 | sort)
      - name: Attest every immutable subject
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            intermediate/**/*.zip
            intermediate/**/manifest.json
            intermediate/**/checksums.sha256
            intermediate/**/evidence/*.json
          show-summary: true
      - name: Assemble retained offline evidence
        run: |
          set -euo pipefail
          mkdir retained
          cp -R intermediate/. retained/
          cp "${{ steps.provenance.outputs.bundle-path }}" retained/attestation.jsonl
      - name: Upload retained candidates and offline bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-release-candidates-${{ github.sha }}
          path: retained
          if-no-files-found: error
          retention-days: 30
