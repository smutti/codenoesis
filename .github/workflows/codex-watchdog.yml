name: Codex - automation watchdog

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codex-automation-watchdog
  cancel-in-progress: true

jobs:
  inspect:
    name: Enforce open-work limits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Inspect agent pull requests without mutating repository state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          AUTOMATION_ENABLED: ${{ vars.CODEX_AUTOMATION_ENABLED }}
          PUBLISHER_BOT_LOGIN: ${{ vars.CODEX_PUBLISHER_BOT_LOGIN }}
        with:
          script: |
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });

            const automationEnabled = process.env.AUTOMATION_ENABLED === "true";
            const publisherLogin = process.env.PUBLISHER_BOT_LOGIN?.trim() ?? "";
            if (
              automationEnabled &&
              !/^[A-Za-z0-9][A-Za-z0-9-]{0,99}$/.test(publisherLogin)
            ) {
              core.setFailed(
                "CODEX_PUBLISHER_BOT_LOGIN must identify the configured publisher App when automation is enabled."
              );
              return;
            }

            const expectedAuthor = publisherLogin ? `${publisherLogin}[bot]` : null;
            const branchPattern = /^codex\/issue-(\d+)-(\d+)-(\d+)$/;
            const machinePulls = pulls.filter(
              (pr) =>
                pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                branchPattern.test(pr.head.ref)
            );
            const agentPulls = machinePulls.filter(
              (pr) => expectedAuthor !== null && pr.user?.login === expectedAuthor
            );
            const unexpectedAuthors = machinePulls.filter(
              (pr) => expectedAuthor === null || pr.user?.login !== expectedAuthor
            );
            const now = Date.now();
            const staleAfterMs = 7 * 24 * 60 * 60 * 1000;
            const stale = agentPulls.filter(
              (pr) => now - Date.parse(pr.updated_at) > staleAfterMs
            );

            const byIssue = new Map();
            for (const pr of agentPulls) {
              const match = pr.head.ref.match(branchPattern);
              if (!match) continue;
              const entries = byIssue.get(match[1]) ?? [];
              entries.push(pr.number);
              byIssue.set(match[1], entries);
            }
            const duplicates = [...byIssue.entries()].filter(
              ([, numbers]) => numbers.length > 1
            );

            await core.summary
              .addHeading("Codex automation watchdog")
              .addTable([
                [
                  { data: "Metric", header: true },
                  { data: "Value", header: true },
                  { data: "Limit", header: true },
                ],
                ["Open Codex PRs", String(agentPulls.length), "20"],
                ["Stale Codex PRs", String(stale.length), "0 after 7 days"],
                ["Issues with duplicate PRs", String(duplicates.length), "0"],
                ["Reserved branches with unexpected authors", String(unexpectedAuthors.length), "0"],
              ])
              .write();

            if (stale.length > 0) {
              core.warning(`Stale Codex PRs: ${stale.map((pr) => `#${pr.number}`).join(", ")}`);
            }
            if (duplicates.length > 0) {
              core.warning(
                `Duplicate issue proposals: ${duplicates
                  .map(([issue, numbers]) => `#${issue} => ${numbers.map((n) => `#${n}`).join(", ")}`)
                  .join("; ")}`
              );
            }

            if (unexpectedAuthors.length > 0) {
              core.warning(
                `Reserved Codex branches with unexpected authors: ${unexpectedAuthors
                  .map((pr) => `#${pr.number}`)
                  .join(", ")}`
              );
            }

            if (
              agentPulls.length > 20 ||
              stale.length > 0 ||
              duplicates.length > 0 ||
              unexpectedAuthors.length > 0
            ) {
              core.setFailed("Codex automation limits require maintainer attention.");
            }
