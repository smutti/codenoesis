name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Verify locked workspace metadata
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Install pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          destination="$RUNNER_TEMP/actionlint-bin"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$destination"
          tar -xzf "$archive" -C "$destination" actionlint
          echo "$destination" >> "$GITHUB_PATH"

      - name: Validate GitHub control plane
        run: |
          set -euo pipefail
          shellcheck --version
          actionlint -no-color
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path) }' \
            .github/ISSUE_TEMPLATE/agent-task.yml \
            .github/ISSUE_TEMPLATE/config.yml \
            .github/dependabot.yml
          python3 .github/codex/scripts/codex_policy.py validate-policy \
            --policy .github/codex/policy.json
          python3 -m json.tool .github/codex/policy.json >/dev/null
          python3 -m json.tool .github/codex/policy.schema.json >/dev/null
          python3 -m json.tool .github/codex/schemas/proposal-output.schema.json >/dev/null
          python3 -m json.tool .github/codex/schemas/review-output.schema.json >/dev/null

      - name: Lint all targets and features
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run unit and target tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Run documentation tests
        run: cargo test --workspace --doc --all-features --locked

      - name: Test benchmark metadata validator
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate benchmark metadata
        run: python3 scripts/validate_benchmark_assets.py

  portability:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record pinned toolchain
        run: |
          rustc --version --verbose
          cargo --version --verbose

      - name: Test all targets and features
        run: cargo test --workspace --all-targets --all-features --locked

  ci-policy-gate:
    name: CI policy gate
    needs: [quality, portability]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Enforce required CI jobs
        env:
          PORTABILITY_RESULT: ${{ needs.portability.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = "success"
          test "$PORTABILITY_RESULT" = "success"
