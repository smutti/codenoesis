<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-R41XZjWjTeEyibhsIBP7psaPv+NxqnUdBpe0aobqE60='; style-src 'sha256-DlrPz5j7NCFDGArFkpQGNY37x++FaVe5CWumM3tlRuw='; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; form-action 'none'; base-uri 'none'; manifest-src 'none'; media-src 'none'; worker-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeNoesis Callable Semantics Explorer</title>
<style>
:root {
  color-scheme: dark;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #07131a;
  color: #e8f2f2;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top left, #17433f 0, #07131a 42rem);
}
header, main { width: min(1200px, calc(100% - 2rem)); margin: 0 auto; }
header { padding: 2rem 0 1rem; }
h1, h2, p { margin-top: 0; }
h1 { margin-bottom: .4rem; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -.035em; }
.subtitle, #status { color: #a7c3c1; }
.panel {
  padding: 1rem;
  border: 1px solid #2d5754;
  border-radius: 14px;
  background: rgba(8, 29, 34, .94);
  box-shadow: 0 16px 50px rgba(0, 0, 0, .22);
}
.controls { display: grid; grid-template-columns: repeat(12, 1fr); gap: .75rem; margin-bottom: 1rem; }
.field { grid-column: span 3; }
.field.wide { grid-column: span 6; }
label { display: block; margin-bottom: .35rem; color: #b0cecb; font-size: .82rem; font-weight: 700; }
input, select, button {
  width: 100%;
  min-height: 2.7rem;
  padding: .65rem .75rem;
  border: 1px solid #3d6a67;
  border-radius: 9px;
  background: #0c292e;
  color: #f1ffff;
}
button { cursor: pointer; border-color: #3ba99d; background: #16796f; font-weight: 750; }
button.secondary { background: #19413f; }
button:disabled { cursor: not-allowed; opacity: .5; }
.grid { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 1rem; padding-bottom: 2rem; }
.results { display: grid; gap: .55rem; max-height: 65vh; overflow: auto; }
.result { text-align: left; border-color: #39716c; background: #123b3d; }
.result strong, .result span { display: block; overflow-wrap: anywhere; }
.result span { margin-top: .25rem; color: #b0cecb; font-size: .78rem; }
pre { margin: 0; color: #dff4f2; font: .84rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.badge { display: inline-block; margin: 0 .35rem .5rem 0; padding: .2rem .55rem; border-radius: 999px; background: #1a4e4a; color: #9bf0e5; font-size: .75rem; }
#status[data-level="error"] { color: #ffaaaa; }
#status[data-level="ok"] { color: #93e5ba; }
@media (max-width: 820px) {
  .field, .field.wide { grid-column: span 12; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Callable Semantics Explorer</h1>
  <p class="subtitle">Read-only inspection of PortableGraphV2. Select the generated JSON explicitly; no repository, server, or network is used.</p>
</header>
<main>
  <section class="panel controls" aria-label="Explorer controls">
    <div class="field wide">
      <label for="graph-file">Portable graph</label>
      <input id="graph-file" type="file" accept="application/json,.json">
    </div>
    <div class="field wide">
      <label for="search">Exact ID or NFC text</label>
      <input id="search" type="search" autocomplete="off" placeholder="Search identities and bounded metadata">
    </div>
    <div class="field">
      <label for="family">Family</label>
      <select id="family">
        <option value="all">All</option>
        <option value="entities">Entities</option>
        <option value="relationships">Relationships</option>
        <option value="claims">Claims</option>
        <option value="evidence">Evidence</option>
        <option value="diagnostics">Diagnostics</option>
        <option value="coverage_gaps">Coverage gaps</option>
        <option value="documents">Documents</option>
      </select>
    </div>
    <div class="field">
      <label for="kind">Exact kind</label>
      <input id="kind" type="text" autocomplete="off" placeholder="rust.callable_signature">
    </div>
    <div class="field">
      <label for="depth">Neighborhood depth</label>
      <select id="depth"><option value="1">1</option><option value="2">2</option></select>
    </div>
    <div class="field"><button id="search-button" disabled>Search</button></div>
    <div class="field wide"><button id="neighborhood-button" class="secondary" disabled>Inspect selected neighborhood</button></div>
    <div class="field wide"><p id="status" role="status">Select portable-graph.json to begin.</p></div>
  </section>
  <section class="grid">
    <article class="panel"><h2>Results</h2><div id="results" class="results"></div></article>
    <article class="panel"><h2>Inspector</h2><div id="summary"></div><pre id="inspector">No subject selected.</pre></article>
  </section>
</main>
<script>
"use strict";

const MAX_TEXT_RESULTS = 100;
const MAX_DEPTH = 2;
const MAX_SUBJECTS = 256;
const MAX_RELATIONSHIPS = 512;
const FAMILIES = ["entities", "relationships", "claims", "evidence", "diagnostics", "coverage_gaps", "documents", "document_statements"];
const FORBIDDEN_FIELDS = new Set(["body_text", "expression_text", "source_contents", "source_snippet", "environment"]);
const graphFile = document.getElementById("graph-file");
const searchInput = document.getElementById("search");
const familySelect = document.getElementById("family");
const kindInput = document.getElementById("kind");
const depthSelect = document.getElementById("depth");
const searchButton = document.getElementById("search-button");
const neighborhoodButton = document.getElementById("neighborhood-button");
const statusNode = document.getElementById("status");
const resultsNode = document.getElementById("results");
const inspectorNode = document.getElementById("inspector");
const summaryNode = document.getElementById("summary");
let graph = null;
let selectedId = null;
let subjects = new Map();

function stableId(item) {
  return item.id || item.entity_id || item.relationship_id || item.claim_id || item.evidence_id || item.document_id || item.statement_id || "";
}

function relationSource(item) { return item.source || item.source_entity_id || ""; }
function relationTarget(item) { return item.target || item.target_entity_id || ""; }

function rejectForbiddenFields(value) {
  if (!value || typeof value !== "object") { return; }
  for (const [key, nested] of Object.entries(value)) {
    if (FORBIDDEN_FIELDS.has(key)) { throw new Error("Portable privacy contract rejected."); }
    rejectForbiddenFields(nested);
  }
}

function validateGraph(value) {
  if (!value || value.schema_version !== "codenoesis.portable-graph/v2") { throw new Error("Unsupported portable graph schema."); }
  for (const family of FAMILIES) {
    if (!Array.isArray(value[family])) { throw new Error("A required portable family is absent."); }
  }
  rejectForbiddenFields(value);
}

function rebuildIndex() {
  subjects = new Map();
  for (const family of FAMILIES) {
    for (const item of graph[family]) {
      const id = stableId(item);
      if (id) { subjects.set(id, { family, item }); }
    }
  }
}

function setStatus(message, level) { statusNode.textContent = message; statusNode.dataset.level = level; }

function evidenceFor(item) {
  const identifiers = new Set();
  function visit(value) {
    if (typeof value === "string" && value.startsWith("urn:codenoesis:evidence:")) { identifiers.add(value); }
    else if (value && typeof value === "object") { Object.values(value).forEach(visit); }
  }
  visit(item);
  return [...identifiers].sort().map(id => subjects.get(id)).filter(Boolean).map(subject => subject.item);
}

function renderInspector(family, item, note) {
  selectedId = stableId(item);
  inspectorNode.textContent = JSON.stringify({ subject: item, linked_evidence: evidenceFor(item) }, null, 2);
  summaryNode.replaceChildren();
  for (const value of [family, selectedId, note]) {
    if (!value) { continue; }
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = value;
    summaryNode.appendChild(badge);
  }
  neighborhoodButton.disabled = !selectedId;
}

function matchesKind(item) {
  const expected = kindInput.value.normalize("NFC");
  return expected === "" || item.kind === expected || item.syntax_kind === expected || item.control_kind === expected;
}

function renderResults(matches, total) {
  resultsNode.replaceChildren();
  for (const match of matches) {
    const button = document.createElement("button");
    const title = document.createElement("strong");
    const detail = document.createElement("span");
    button.className = "result";
    title.textContent = match.id;
    detail.textContent = match.family + (match.item.kind ? " · " + match.item.kind : "");
    button.append(title, detail);
    button.addEventListener("click", () => renderInspector(match.family, match.item, "bounded portable metadata"));
    resultsNode.appendChild(button);
  }
  setStatus(matches.length + " result(s)" + (total > matches.length ? " shown from " + total + "; truncated." : "."), "ok");
}

function runSearch() {
  if (!graph) { return; }
  const query = searchInput.value.normalize("NFC");
  const family = familySelect.value;
  const exact = subjects.get(query);
  if (exact && (family === "all" || family === exact.family) && matchesKind(exact.item)) {
    renderResults([{ id: query, family: exact.family, item: exact.item }], 1);
    return;
  }
  const matches = [];
  for (const candidateFamily of FAMILIES) {
    if (candidateFamily === "document_statements" || (family !== "all" && family !== candidateFamily)) { continue; }
    for (const item of graph[candidateFamily]) {
      if (matchesKind(item) && (query === "" || JSON.stringify(item).normalize("NFC").includes(query))) {
        matches.push({ id: stableId(item), family: candidateFamily, item });
      }
    }
  }
  matches.sort((left, right) => left.id < right.id ? -1 : left.id > right.id ? 1 : 0);
  renderResults(matches.slice(0, MAX_TEXT_RESULTS), matches.length);
}

function inspectNeighborhood() {
  if (!graph || !selectedId) { return; }
  const depth = Math.min(Math.max(Number(depthSelect.value || 1), 1), MAX_DEPTH);
  const relationships = [...graph.relationships].sort((left, right) => stableId(left).localeCompare(stableId(right)));
  const queue = [{ id: selectedId, depth: 0 }];
  const visited = new Set();
  const selectedRelationships = [];
  while (queue.length && visited.size < MAX_SUBJECTS) {
    const current = queue.shift();
    if (!current || visited.has(current.id)) { continue; }
    visited.add(current.id);
    if (current.depth >= depth) { continue; }
    for (const relationship of relationships) {
      if (selectedRelationships.length >= MAX_RELATIONSHIPS) { break; }
      const source = relationSource(relationship);
      const target = relationTarget(relationship);
      if (source !== current.id && target !== current.id) { continue; }
      if (!selectedRelationships.some(item => stableId(item) === stableId(relationship))) { selectedRelationships.push(relationship); }
      const neighbor = source === current.id ? target : source;
      if (neighbor && !visited.has(neighbor) && queue.length + visited.size < MAX_SUBJECTS) { queue.push({ id: neighbor, depth: current.depth + 1 }); }
    }
  }
  inspectorNode.textContent = JSON.stringify({ root_id: selectedId, depth, subject_ids: [...visited].sort(), relationships: selectedRelationships }, null, 2);
  setStatus("Neighborhood rendered without modifying the portable graph.", "ok");
}

graphFile.addEventListener("change", async () => {
  const file = graphFile.files && graphFile.files[0];
  if (!file) { return; }
  try {
    const parsed = JSON.parse(await file.text());
    validateGraph(parsed);
    graph = parsed;
    selectedId = null;
    rebuildIndex();
    searchButton.disabled = false;
    neighborhoodButton.disabled = true;
    resultsNode.replaceChildren();
    summaryNode.replaceChildren();
    inspectorNode.textContent = "PortableGraphV2 loaded. Search an exact ID or bounded metadata value.";
    setStatus("PortableGraphV2 loaded locally; no network, source repository, or target process used.", "ok");
  } catch (error) {
    graph = null;
    selectedId = null;
    subjects = new Map();
    searchButton.disabled = true;
    neighborhoodButton.disabled = true;
    resultsNode.replaceChildren();
    summaryNode.replaceChildren();
    inspectorNode.textContent = "Projection rejected.";
    setStatus(error instanceof Error ? error.message : "Projection rejected.", "error");
  }
});

searchButton.addEventListener("click", runSearch);
searchInput.addEventListener("keydown", event => { if (event.key === "Enter") { runSearch(); } });
neighborhoodButton.addEventListener("click", inspectNeighborhood);
</script>
</body>
</html>
