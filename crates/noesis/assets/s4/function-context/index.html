<body>
  <header>
    <h1>CodeNoesis Function Context</h1>
    <p>Offline, declared-source navigation for canonical PortableGraphV9 artifacts.</p>
  </header>
  <main>
    <aside class="panel sidebar">
      <div class="toolbar">
        <label for="graph-file">Select portable-graph.json</label>
        <input id="graph-file" type="file" accept="application/json,.json">
        <label for="search">Function or exact-ID search</label>
        <input id="search" type="search" autocomplete="off" disabled>
        <div class="row">
          <button id="back" type="button" disabled>Back</button>
          <button id="forward" type="button" disabled>Forward</button>
          <label for="depth">Depth</label>
          <select id="depth" disabled><option value="1">1</option><option value="2">2</option></select>
          <button id="draw" type="button" disabled>Graph</button>
        </div>
      </div>
      <div id="status" class="status">No graph selected.</div>
      <div class="section">
        <h3>Functions</h3>
        <div id="results" class="results"></div>
      </div>
    </aside>
    <section class="content">
      <article id="card" class="panel"><p class="empty">Select a canonical graph, then choose a function.</p></article>
      <article class="panel">
        <h2>Bounded Neighborhood</h2>
        <p id="graph-status">No subject selected.</p>
        <svg id="graph" viewBox="0 0 900 440" role="img" aria-label="Bounded knowledge graph"></svg>
      </article>
    </section>
  </main>
  <script>
"use strict";
const PORTABLE_SCHEMA="codenoesis.portable-graph/v9";
const CONTEXT_SCHEMA="codenoesis.function-context/v1";
const MAX_FILE_BYTES=268435456;
const MAX_SEARCH_RESULTS=100;
const MAX_HISTORY=128;
const MAX_SUBJECTS=256;
const MAX_RELATIONSHIPS=512;
const MAX_PARAMETERS=256;
const MAX_CLAIMS=2048;
const MAX_EVIDENCE=2048;
const MAX_UNCERTAINTY=1024;
const LIMITATIONS=["active_cfg_not_selected","compiler_validity_not_proven","declared_types_not_resolved","dispatch_not_resolved","ownership_and_aliasing_not_computed","returned_values_not_proven","runtime_behavior_not_observed","side_effects_not_computed"];
const DENIED_FIELDS=new Set(["absolute_path","absolute_root","argument","arguments","body_source","body_text","condition_source","condition_text","credential","credentials","environment","expression_source","expression_text","initializer_source","initializer_text","literal_lexeme","literal_text","model_data","raw_url","repository_root","source_contents","source_snippet","telemetry","url"]);
const REQUIRED_ARRAYS=["entities","relationships","claims","evidence","diagnostics","coverage_gaps","documents","document_statements"];
const state={graph:null,maps:null,functions:[],selectedId:null,currentContext:null,navigation:[],position:-1};
const fileInput=document.getElementById("graph-file");
const searchInput=document.getElementById("search");
const backButton=document.getElementById("back");
const forwardButton=document.getElementById("forward");
const depthSelect=document.getElementById("depth");
const drawButton=document.getElementById("draw");
const statusNode=document.getElementById("status");
const resultsNode=document.getElementById("results");
const cardNode=document.getElementById("card");
const graphNode=document.getElementById("graph");
const graphStatus=document.getElementById("graph-status");

function clear(node){while(node.firstChild){node.removeChild(node.firstChild);}}
function element(tag,text,className){const value=document.createElement(tag);if(text!==undefined){value.textContent=String(text);}if(className){value.className=className;}return value;}
function button(label,identifier){const value=element("button",label);value.type="button";value.addEventListener("click",()=>navigate(identifier,true));return value;}
function setStatus(message,error=false){statusNode.textContent=message;statusNode.className=error?"status error":"status";}
function setControls(enabled){searchInput.disabled=!enabled;depthSelect.disabled=!enabled;drawButton.disabled=!enabled;updateHistoryButtons();}
function updateHistoryButtons(){backButton.disabled=!state.graph||state.position<=0;forwardButton.disabled=!state.graph||state.position>=state.navigation.length-1;}
function rejectGraph(reason){state.graph=null;state.maps=null;state.functions=[];state.selectedId=null;state.currentContext=null;state.navigation=[];state.position=-1;searchInput.value="";clear(resultsNode);clear(cardNode);cardNode.appendChild(element("p","Graph rejected. Select a valid PortableGraphV9 file.","empty"));clear(graphNode);graphStatus.textContent="No subject selected.";setControls(false);setStatus(reason,true);window.history.replaceState(null,"",window.location.pathname);}
function requireObject(value,label){if(value===null||typeof value!=="object"||Array.isArray(value)){throw new Error(label+" must be an object");}return value;}
function requireArray(value,label){if(!Array.isArray(value)){throw new Error(label+" must be an array");}return value;}
function requireString(value,label){if(typeof value!=="string"||value.length===0){throw new Error(label+" must be a non-empty string");}return value;}
function inspectPrivacy(value,depth=0){if(depth>64){throw new Error("JSON nesting exceeds 64");}if(Array.isArray(value)){for(const item of value){inspectPrivacy(item,depth+1);}return;}if(value!==null&&typeof value==="object"){for(const [key,nested] of Object.entries(value)){if(DENIED_FIELDS.has(key)){throw new Error("Denied field: "+key);}inspectPrivacy(nested,depth+1);}return;}if(typeof value==="string"&&value.includes("://")){throw new Error("Raw URL is not permitted");}}
function makeMap(records,family){const result=new Map();for(const record of records){requireObject(record,family+" record");const identifier=requireString(record.id,family+" ID");if(result.has(identifier)){throw new Error("Duplicate "+family+" ID");}result.set(identifier,record);}return result;}
function collectEvidence(value,result){if(Array.isArray(value)){for(const item of value){collectEvidence(item,result);}return;}if(value===null||typeof value!=="object"){return;}for(const [key,nested] of Object.entries(value)){if(key==="evidence_id"||key.endsWith("_evidence_id")){if(nested!==null){result.add(requireString(nested,key));}}else if(key==="evidence_ids"||key.endsWith("_evidence_ids")){for(const identifier of requireArray(nested,key)){result.add(requireString(identifier,key));}}else{collectEvidence(nested,result);}}}
function validateGraph(graph,text){requireObject(graph,"graph");if(graph.schema_version!==PORTABLE_SCHEMA){throw new Error("Unsupported portable graph schema");}if(JSON.stringify(graph)+"\n"!==text){throw new Error("Portable graph is not canonical LF-terminated JSON");}for(const family of REQUIRED_ARRAYS){requireArray(graph[family],family);}requireObject(graph.local_flow_index,"local_flow_index");requireArray(graph.local_flow_index.derivations,"local_flow_index.derivations");requireObject(graph.constant_evaluation_index,"constant_evaluation_index");requireArray(graph.constant_evaluation_index.derivations,"constant_evaluation_index.derivations");inspectPrivacy(graph);
  const maps={entities:makeMap(graph.entities,"entity"),relationships:makeMap(graph.relationships,"relationship"),claims:makeMap(graph.claims,"claim"),evidence:makeMap(graph.evidence,"evidence"),diagnostics:makeMap(graph.diagnostics,"diagnostic"),coverage:makeMap(graph.coverage_gaps,"coverage gap")};
  for(const relationship of graph.relationships){const source=requireString(relationship.source,"relationship source");const target=requireString(relationship.target,"relationship target");if(!maps.entities.has(source)||!maps.entities.has(target)){throw new Error("Dangling relationship endpoint");}}
  for(const claim of graph.claims){const subject=requireString(claim.subject_id,"claim subject");if(claim.subject_kind==="entity"){if(!maps.entities.has(subject)){throw new Error("Dangling entity claim");}}else if(claim.subject_kind==="relationship"){if(!maps.relationships.has(subject)){throw new Error("Dangling relationship claim");}}else{throw new Error("Unsupported claim subject kind");}}
  const evidenceIds=new Set();collectEvidence(graph,evidenceIds);for(const identifier of evidenceIds){if(!maps.evidence.has(identifier)){throw new Error("Dangling evidence reference");}}
  return maps;
}
function sorted(records){const result=[...records].sort((left,right)=>requireString(left.id,"record ID").localeCompare(requireString(right.id,"record ID")));for(let index=1;index<result.length;index+=1){if(result[index-1].id===result[index].id){throw new Error("Duplicate selected ID");}}return result;}
function selectedReference(value,entityIds,relationshipIds){if(typeof value==="string"){return entityIds.has(value)||relationshipIds.has(value);}if(Array.isArray(value)){return value.some(item=>selectedReference(item,entityIds,relationshipIds));}if(value!==null&&typeof value==="object"){return Object.values(value).some(item=>selectedReference(item,entityIds,relationshipIds));}return false;}
function callSummary(relationship){const source=state.maps.entities.get(relationship.source);const target=state.maps.entities.get(relationship.target);if(!source||!target){throw new Error("Dangling call");}return{relationship_id:relationship.id,source_id:source.id,source_kind:source.kind,source_name:source.name,target_id:target.id,target_kind:target.kind,target_name:target.name,state:"proven_unique_local"};}
function normalizedComponent(value,label){return requireString(value,label).trim().split(/\s+/).join(" ");}
function optionalComponent(value,label){if(value===null||value===undefined){return null;}return normalizedComponent(value,label);}
function displaySignature(root,signature,parameters){const declared=root.properties&&root.properties.declared_signature;if(typeof declared==="string"&&declared.trim().length>0){return normalizedComponent(declared,"declared signature");}const properties=requireObject(signature.properties,"signature properties");const prefixes={public:"pub ",crate:"pub(crate) ",restricted:"pub(…) ",private:"",inherited_trait:"",not_applicable:""};if(!(properties.visibility in prefixes)){throw new Error("Invalid signature visibility");}let value=prefixes[properties.visibility];for(const [field,keyword] of [["const","const "],["async","async "],["unsafe","unsafe "]]){if(typeof properties[field]!=="boolean"){throw new Error("Invalid signature qualifier");}if(properties[field]){value+=keyword;}}const abi=optionalComponent(properties.abi,"ABI");if(abi!==null){value+='extern "'+abi+'" ';}value+="fn "+normalizedComponent(root.name,"callable name");const generics=optionalComponent(properties.generic_parameters,"generic parameters");if(generics!==null){value+=generics;}value+="("+parameters.map(parameter=>{const pattern=normalizedComponent(parameter.properties&&parameter.properties.pattern,"parameter pattern");const declaredType=optionalComponent(parameter.properties&&parameter.properties.declared_type,"declared parameter type");return declaredType===null?pattern:pattern+": "+declaredType;}).join(", ")+")";if(properties.return_state==="declared"){value+=" -> "+normalizedComponent(properties.return_type,"declared return type");}else if(properties.return_state!=="unit_default"||properties.return_type!==null){throw new Error("Invalid return declaration");}const whereClause=optionalComponent(properties.where_clause,"where clause");if(whereClause!==null){value+=" "+whereClause;}return value;}
function buildContext(rootId){const root=state.maps.entities.get(rootId);if(!root||!(root.kind==="rust.function"||root.kind==="rust.method")){throw new Error("Selected subject is not a callable");}
  const signatureLinks=state.graph.relationships.filter(item=>item.kind==="HAS_SIGNATURE"&&item.source===rootId);if(signatureLinks.length!==1){throw new Error(signatureLinks.length===0?"Missing signature":"Duplicate signature");}const signatureId=signatureLinks[0].target;const signature=state.maps.entities.get(signatureId);if(!signature||signature.kind!=="rust.callable_signature"||signature.subject_id!==rootId){throw new Error("Invalid signature link");}
  const parameterLinks=state.graph.relationships.filter(item=>item.kind==="HAS_PARAMETER"&&item.source===signatureId);const parameters=parameterLinks.map(item=>state.maps.entities.get(item.target));if(parameters.some(item=>!item||item.kind!=="rust.parameter"||item.subject_id!==rootId)){throw new Error("Invalid parameter link");}parameters.sort((left,right)=>left.ordinal-right.ordinal||left.id.localeCompare(right.id));if(parameters.length>MAX_PARAMETERS||parameters.some((item,index)=>item.ordinal!==index)){throw new Error("Invalid or excessive parameter ordinal");}
  const bodyLinks=state.graph.relationships.filter(item=>item.kind==="HAS_BODY_FACT"&&item.source===rootId);const bodyFacts=bodyLinks.map(item=>state.maps.entities.get(item.target));if(bodyFacts.some(item=>!item||item.subject_id!==rootId)){throw new Error("Invalid body-fact link");}bodyFacts.sort((left,right)=>left.ordinal-right.ordinal||left.id.localeCompare(right.id));
  const callLinks=state.graph.relationships.filter(item=>item.kind==="CALLS"&&(item.source===rootId||item.target===rootId));const outgoing=callLinks.filter(item=>item.source===rootId).map(callSummary).sort((a,b)=>a.relationship_id.localeCompare(b.relationship_id));const incoming=callLinks.filter(item=>item.target===rootId).map(callSummary).sort((a,b)=>a.relationship_id.localeCompare(b.relationship_id));
  const owner=root.owner_id?state.maps.entities.get(root.owner_id):null;if(root.owner_id&&!owner){throw new Error("Dangling owner");}
  const entityIds=new Set([rootId,signatureId]);if(owner){entityIds.add(owner.id);}for(const item of [...parameters,...bodyFacts]){entityIds.add(item.id);}for(const item of callLinks){entityIds.add(item.source);entityIds.add(item.target);}
  const relationships=sorted([...signatureLinks,...parameterLinks,...bodyLinks,...callLinks]);if(entityIds.size>MAX_SUBJECTS||relationships.length>MAX_RELATIONSHIPS){throw new Error("Function neighborhood exceeds limits");}const relationshipIds=new Set(relationships.map(item=>item.id));
  const claims=sorted(state.graph.claims.filter(item=>entityIds.has(item.subject_id)||relationshipIds.has(item.subject_id)));if(claims.length>MAX_CLAIMS){throw new Error("Linked claims exceed limit");}
  const derivations=[...state.graph.local_flow_index.derivations,...state.graph.constant_evaluation_index.derivations].filter(item=>selectedReference(item,entityIds,relationshipIds)).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));
  const diagnostics=sorted(state.graph.diagnostics.filter(item=>entityIds.has(item.subject_id)));const coverageGaps=sorted(state.graph.coverage_gaps.filter(item=>entityIds.has(item.subject_id)));if(diagnostics.length+coverageGaps.length+derivations.length>MAX_UNCERTAINTY){throw new Error("Uncertainty records exceed limit");}
  const evidenceIds=new Set();for(const item of [root,owner,signature,...parameters,...bodyFacts,...relationships,...claims,...diagnostics,...coverageGaps,...derivations]){if(item){collectEvidence(item,evidenceIds);}}const evidence=sorted([...evidenceIds].map(identifier=>{const item=state.maps.evidence.get(identifier);if(!item){throw new Error("Dangling context evidence");}return item;}));if(evidence.length>MAX_EVIDENCE){throw new Error("Linked evidence exceeds limit");}
  const roles=new Map();const role=(identifier,value)=>{if(!roles.has(identifier)){roles.set(identifier,new Set());}roles.get(identifier).add(value);};role(rootId,"callable");if(owner){role(owner.id,"owner");}role(signatureId,"signature");for(const item of parameters){role(item.id,"parameter");}for(const item of bodyFacts){role(item.id,"body_fact");}for(const item of outgoing){role(item.target_id,"outgoing_callee");}for(const item of incoming){role(item.source_id,"incoming_caller");}
  const navigation=[...entityIds].sort().map(identifier=>{const item=state.maps.entities.get(identifier);const relationship_ids=relationships.filter(link=>link.source===identifier||link.target===identifier).map(link=>link.id);return{id:identifier,family:"entities",kind:item.kind,name:item.name,roles:[...roles.get(identifier)].sort(),relationship_ids};});
  const normalizedSignature=displaySignature(root,signature,parameters);
  return{schema_version:CONTEXT_SCHEMA,authority:"declared_source_only",display_signature:normalizedSignature,callable:root,owner,signature,parameters,body_facts:bodyFacts,calls:{outgoing,incoming},relationships,claims,evidence,diagnostics,coverage_gaps:coverageGaps,derivations,navigation,limitations:[...LIMITATIONS]};
}
function datum(label,value){const item=element("div",undefined,"datum");item.appendChild(element("b",label));item.appendChild(element("span",value===null?"explicitly absent":value));return item;}
function section(title){const value=element("section",undefined,"section");value.appendChild(element("h3",title));return value;}
function recordView(record,primaryId){const wrapper=element("div",undefined,"record");const heading=element("div");heading.appendChild(button(record.name||record.kind||record.code||record.capability||record.id,record.id));if(record.kind){heading.appendChild(element("span",record.kind,"badge"));}wrapper.appendChild(heading);if(record.id!==primaryId){wrapper.appendChild(element("p",record.id));}const summary={...record};delete summary.id;delete summary.name;delete summary.kind;const pre=element("pre",JSON.stringify(summary,null,2));wrapper.appendChild(pre);return wrapper;}
function appendRecords(parent,title,records,primaryId){const value=section(title);const list=element("div",undefined,"records");if(records.length===0){list.appendChild(element("p","None recorded.","empty"));}else{for(const record of records){list.appendChild(recordView(record,primaryId));}}value.appendChild(list);parent.appendChild(value);}
function renderContext(context){clear(cardNode);const title=element("h2",context.callable.name+" · "+context.callable.kind);cardNode.appendChild(title);cardNode.appendChild(element("div",context.display_signature,"signature"));const meta=element("div",undefined,"meta");meta.appendChild(datum("Owner",context.owner?context.owner.name:"none"));meta.appendChild(datum("Module",context.callable.module_path||"explicitly absent"));meta.appendChild(datum("Visibility",context.callable.visibility||context.signature.properties.visibility));meta.appendChild(datum("Return",context.signature.properties.return_type));meta.appendChild(datum("Receiver",context.parameters[0]&&context.parameters[0].properties.receiver_state!=="none"?context.parameters[0].properties.receiver_state:"none"));meta.appendChild(datum("Authority",context.authority));cardNode.appendChild(meta);
  const qualifiers=section("Signature Details");const properties=context.signature.properties;const details=element("div",undefined,"meta");details.appendChild(datum("async",properties.async));details.appendChild(datum("const",properties.const));details.appendChild(datum("unsafe",properties.unsafe));details.appendChild(datum("ABI",properties.abi));details.appendChild(datum("Generics",properties.generic_parameters));details.appendChild(datum("Where",properties.where_clause));details.appendChild(datum("Return state",properties.return_state));qualifiers.appendChild(details);cardNode.appendChild(qualifiers);
  const parameterSection=section("Ordered Parameters");if(context.parameters.length===0){parameterSection.appendChild(element("p","No declared parameters.","empty"));}else{const table=element("table");const head=element("tr");for(const label of ["#","Name / pattern","Declared type","Receiver","Navigate"]){head.appendChild(element("th",label));}table.appendChild(head);for(const parameter of context.parameters){const row=element("tr");row.appendChild(element("td",parameter.ordinal));row.appendChild(element("td",parameter.properties.pattern));row.appendChild(element("td",parameter.properties.declared_type===null?"explicitly absent":parameter.properties.declared_type));row.appendChild(element("td",parameter.properties.receiver_state));const action=element("td");action.appendChild(button("Open",parameter.id));row.appendChild(action);table.appendChild(row);}parameterSection.appendChild(table);}cardNode.appendChild(parameterSection);
  appendRecords(cardNode,"Outgoing Calls",context.calls.outgoing.map(item=>({id:item.target_id,name:item.target_name,kind:item.target_kind,relationship_id:item.relationship_id,state:item.state})),context.callable.id);appendRecords(cardNode,"Incoming Calls",context.calls.incoming.map(item=>({id:item.source_id,name:item.source_name,kind:item.source_kind,relationship_id:item.relationship_id,state:item.state})),context.callable.id);appendRecords(cardNode,"Body Facts",context.body_facts,context.callable.id);appendRecords(cardNode,"Claims",context.claims,context.callable.id);appendRecords(cardNode,"Evidence",context.evidence,context.callable.id);appendRecords(cardNode,"Diagnostics",context.diagnostics,context.callable.id);appendRecords(cardNode,"Coverage Gaps",context.coverage_gaps,context.callable.id);appendRecords(cardNode,"Derivations",context.derivations.map((item,index)=>({id:item.relationship_id||item.entity_id||("derivation-"+index),kind:"derivation",properties:item})),context.callable.id);
  const limits=section("Explicit Limitations");for(const limitation of context.limitations){limits.appendChild(element("span",limitation,"badge"));}cardNode.appendChild(limits);
}
function allRecord(identifier){for(const family of [state.maps.entities,state.maps.relationships,state.maps.claims,state.maps.evidence,state.maps.diagnostics,state.maps.coverage]){if(family.has(identifier)){return family.get(identifier);}}return null;}
function relatedCallable(record){if(!record){return null;}if(record.kind==="rust.function"||record.kind==="rust.method"){return record.id;}if(record.subject_id&&state.maps.entities.has(record.subject_id)){const subject=state.maps.entities.get(record.subject_id);if(subject.kind==="rust.function"||subject.kind==="rust.method"){return subject.id;}if(subject.subject_id){return subject.subject_id;}}for(const relationship of state.graph.relationships){if(relationship.source===record.id||relationship.target===record.id){for(const endpoint of [relationship.source,relationship.target]){const entity=state.maps.entities.get(endpoint);if(entity&&(entity.kind==="rust.function"||entity.kind==="rust.method")){return endpoint;}}}}return null;}
function renderDetail(identifier){clear(cardNode);const record=allRecord(identifier);if(!record){cardNode.appendChild(element("p","Unknown subject.","empty"));return;}cardNode.appendChild(element("h2",record.name||record.kind||record.code||record.capability||"Selected subject"));cardNode.appendChild(element("p",identifier));cardNode.appendChild(recordView(record,identifier));const callable=relatedCallable(record);if(callable&&callable!==identifier){const row=element("div",undefined,"row");row.appendChild(button("Open owning callable",callable));cardNode.appendChild(row);}}
function updateFragment(identifier){window.history.replaceState(null,"","#id="+encodeURIComponent(identifier));}
function navigate(identifier,push){if(!state.graph||!allRecord(identifier)){return;}if(push){const retained=state.navigation.slice(0,state.position+1);retained.push(identifier);state.navigation=retained.slice(-MAX_HISTORY);state.position=state.navigation.length-1;}state.selectedId=identifier;const record=state.maps.entities.get(identifier);if(record&&(record.kind==="rust.function"||record.kind==="rust.method")){try{state.currentContext=buildContext(identifier);renderContext(state.currentContext);}catch(error){state.currentContext=null;clear(cardNode);cardNode.appendChild(element("p",error.message,"warning"));}}else{state.currentContext=null;renderDetail(identifier);}updateFragment(identifier);updateHistoryButtons();drawNeighborhood();}
function renderSearch(){clear(resultsNode);if(!state.graph){return;}const query=searchInput.value.trim().toLowerCase();let results;if(query.length===0){results=state.functions;}else if(allRecord(searchInput.value.trim())){results=[allRecord(searchInput.value.trim())];}else{results=state.functions.filter(item=>(item.name+" "+item.kind+" "+item.module_path+" "+item.id).toLowerCase().includes(query));}const bounded=results.slice(0,MAX_SEARCH_RESULTS);for(const item of bounded){const value=element("button",undefined,"result");value.type="button";value.appendChild(element("strong",item.name||item.kind));value.appendChild(element("span",(item.module_path||"")+" · "+item.kind));value.addEventListener("click",()=>navigate(item.id,true));resultsNode.appendChild(value);}if(results.length>MAX_SEARCH_RESULTS){resultsNode.appendChild(element("p","Showing the first 100 deterministic matches.","warning"));}if(bounded.length===0){resultsNode.appendChild(element("p","No matching function.","empty"));}}
function neighborhood(identifier,depth){const subjects=new Set([identifier]);const links=[];let frontier=[identifier];for(let level=0;level<depth;level+=1){const next=new Set();for(const relationship of state.graph.relationships){if(frontier.includes(relationship.source)||frontier.includes(relationship.target)){links.push(relationship);next.add(relationship.source);next.add(relationship.target);}}for(const value of next){subjects.add(value);}if(subjects.size>MAX_SUBJECTS||links.length>MAX_RELATIONSHIPS){throw new Error("Neighborhood exceeds the reviewed rendering limits");}frontier=[...next].filter(value=>!frontier.includes(value));}const uniqueLinks=new Map();for(const link of links){uniqueLinks.set(link.id,link);}const ordered=[identifier,...[...subjects].filter(value=>value!==identifier).sort()];return{subjects:ordered,links:[...uniqueLinks.values()].sort((a,b)=>a.id.localeCompare(b.id))};}
function svg(tag){return document.createElementNS(graphNode.namespaceURI,tag);}
function drawNeighborhood(){clear(graphNode);if(!state.graph||!state.selectedId){graphStatus.textContent="No subject selected.";return;}try{const data=neighborhood(state.selectedId,Number(depthSelect.value));const center={x:450,y:220};const points=new Map();data.subjects.forEach((identifier,index)=>{if(index===0){points.set(identifier,center);return;}const angle=(Math.PI*2*(index-1))/Math.max(1,data.subjects.length-1)-Math.PI/2;const radius=data.subjects.length>18?175:145;points.set(identifier,{x:center.x+Math.cos(angle)*radius,y:center.y+Math.sin(angle)*radius});});for(const link of data.links){const source=points.get(link.source);const target=points.get(link.target);if(!source||!target){continue;}const line=svg("line");line.setAttribute("x1",source.x);line.setAttribute("y1",source.y);line.setAttribute("x2",target.x);line.setAttribute("y2",target.y);line.setAttribute("class","edge");graphNode.appendChild(line);}for(const identifier of data.subjects){const point=points.get(identifier);const record=state.maps.entities.get(identifier);const circle=svg("circle");circle.setAttribute("cx",point.x);circle.setAttribute("cy",point.y);circle.setAttribute("r",identifier===state.selectedId?12:8);circle.setAttribute("class","node");circle.setAttribute("tabindex","0");circle.addEventListener("click",()=>navigate(identifier,true));graphNode.appendChild(circle);const label=svg("text");label.setAttribute("x",point.x+12);label.setAttribute("y",point.y+4);label.setAttribute("class","node-label");label.textContent=record?record.name:identifier.slice(-8);graphNode.appendChild(label);}graphStatus.textContent=data.subjects.length+" subjects · "+data.links.length+" relationships · depth "+depthSelect.value;}catch(error){clear(graphNode);graphStatus.textContent=error.message;}}
async function loadSelectedFile(){const file=fileInput.files&&fileInput.files[0];if(!file){rejectGraph("No graph selected.");return;}if(file.size===0||file.size>MAX_FILE_BYTES){rejectGraph("File size is outside the 1..268435456 byte boundary.");return;}setStatus("Validating selected graph…");try{const text=await file.text();const graph=JSON.parse(text);const maps=validateGraph(graph,text);state.graph=graph;state.maps=maps;state.functions=graph.entities.filter(item=>item.kind==="rust.function"||item.kind==="rust.method").sort((a,b)=>a.id.localeCompare(b.id));state.navigation=[];state.position=-1;state.selectedId=null;state.currentContext=null;setControls(true);setStatus("Validated "+file.name+"\n"+state.functions.length+" callable subjects · network disabled");renderSearch();const fragment=new URLSearchParams(window.location.hash.slice(1)).get("id");const initial=fragment&&allRecord(fragment)?fragment:(state.functions[0]&&state.functions[0].id);if(initial){navigate(initial,true);}else{clear(cardNode);cardNode.appendChild(element("p","No functions are present in this graph.","empty"));}}catch(error){rejectGraph("Rejected: "+error.message);}}
fileInput.addEventListener("change",loadSelectedFile);searchInput.addEventListener("input",renderSearch);backButton.addEventListener("click",()=>{if(state.position>0){state.position-=1;navigate(state.navigation[state.position],false);}});forwardButton.addEventListener("click",()=>{if(state.position<state.navigation.length-1){state.position+=1;navigate(state.navigation[state.position],false);}});depthSelect.addEventListener("change",drawNeighborhood);drawButton.addEventListener("click",drawNeighborhood);
window.codenoesisR17=Object.freeze({selectId(identifier){navigate(identifier,true);},currentContext(){return state.currentContext?JSON.parse(JSON.stringify(state.currentContext)):null;},selectedId(){return state.selectedId;},validated(){return state.graph!==null;}});
