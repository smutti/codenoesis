openapi: 3.1.0
info:
  title: Fixture User Service
  version: 1.0.0
servers:
  - url: https://api.example.invalid
    variables:
      environment:
        default: production
security:
  - {}
paths:
  /users/{id}:
    get:
      operationId: getUser
      callbacks:
        onUserChanged: {}
      responses:
        "200":
          description: User
          links:
            self:
              operationId: getUser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
            application/xml:
              schema:
                $ref: "#/components/schemas/User"
webhooks:
  userChanged: {}
components:
  schemas:
    User:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        nickname:
          type: string
        displayName:
          type: string
