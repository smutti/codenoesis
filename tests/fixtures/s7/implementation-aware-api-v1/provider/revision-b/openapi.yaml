openapi: 3.1.0
info:
  title: Fixture User Service
  version: 1.0.0
servers:
  - url: https://api.example.invalid
paths:
  /users/{id}:
    get:
      operationId: getUser
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
components:
  schemas:
    User:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        nickname:
          type: string
        displayName:
          type: string
