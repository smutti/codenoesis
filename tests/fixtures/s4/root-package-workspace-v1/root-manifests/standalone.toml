[package]
name = "root-app"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "root_app"
path = "src/lib.rs"

[[bin]]
name = "root-app"
path = "src/main.rs"

[[bin]]
name = "root-admin"
path = "src/bin/admin.rs"
required-features = ["admin"]

[features]
admin = []

[dependencies]
serde = "1"
