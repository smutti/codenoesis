[workspace]
members = [
    "crates/codenoesis-application",
    "crates/codenoesis-contract-extractors",
    "crates/codenoesis-contracts",
    "crates/codenoesis-domain",
    "crates/codenoesis-lang-rust",
    "crates/codenoesis-ports",
    "crates/codenoesis-repository",
    "crates/codenoesis-scip",
    "crates/codenoesis-store-local",
    "crates/noesis",
    "xtask",
]
resolver = "3"

[workspace.dependencies]
atomicwrites = "=0.4.4"
blake3 = { version = "1", features = ["pure"] }
codenoesis-application = { path = "crates/codenoesis-application" }
codenoesis-contract-extractors = { path = "crates/codenoesis-contract-extractors" }
codenoesis-contracts = { path = "crates/codenoesis-contracts" }
codenoesis-domain = { path = "crates/codenoesis-domain" }
codenoesis-lang-rust = { path = "crates/codenoesis-lang-rust" }
codenoesis-ports = { path = "crates/codenoesis-ports" }
codenoesis-repository = { path = "crates/codenoesis-repository" }
codenoesis-scip = { path = "crates/codenoesis-scip" }
codenoesis-store-local = { path = "crates/codenoesis-store-local" }
crc32fast = "=1.5.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
landlock = "0.4.5"
libc = "0.2"
protobuf = "=3.7.2"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
same-file = "=1.0.6"
seccompiler = "0.5"
serde_json = "1"
sha1 = "0.11"
sha1collisiondetection = { version = "=0.3.4", default-features = false }
sha2 = "0.11"
scip = "=0.9.0"
tempfile = "=3.27.0"
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
unicode-normalization = "0.1.25"
yaml-rust2 = { version = "=0.11.0", default-features = false }

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/smutti/codenoesis"
rust-version = "1.97.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
